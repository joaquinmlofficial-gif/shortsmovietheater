<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Showtimes</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <link rel="stylesheet" href="showtimes_styles.css">
    <script src="shorts-script.js" defer></script>
    <link rel="icon" type="image/jpeg" href="Assets/shorts_logo.jpg">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oi&display=swap" rel="stylesheet">
  </head>
<body>
 <div class="wrapper-container">
    <div class="header">
      <div></div>
      <div style="grid-column:span 3;">      
        <img src="Assets/shorts_wordmark.png" class="wordmark">
      </div>
      <img src="Assets/short_disco.png" class="hamburger">
    </div>
    <div class="parent">
      <div class="title">
        <h2 class="oi-regular">Showtimes</h2>
      </div>
      <div class="showtime-parent">
        <img src="Assets/showtimes_board.png" class="showtimes">
        <div>
          <p id="now_playing">Loading now playing CSV data...</p>
        </div>

        <div class="times">
          <p id="times">Loading times CSV data...</p>
        </div>

        <div class="titles">
          <p id="titles">Loading titles CSV data...</p>
        </div>

        <div class="lengths">
          <p id="lengths" class="length">Loading lengths CSV data...</p>
        </div>

        <script>
            // Reads 'data.csv' automatically if it sits in the same folder as this HTML file
            fetch('shorts_schedule.csv')
                .then(response => response.text())
                .then(data => {
                  const lines = data.trim().split("\r");
                  const headers = lines[0].split(",");

                  const result = lines.slice(1).map(row => {
                    const values = row.split(",");
                    return headers.reduce((obj, header, index) => {
                      obj[header] = values[index];
                      return obj;
                    }, {});
                  });
                  console.log(result)
                  console.log(result[1])

                  const now_playing = result[1][1]
                  console.log(result[1])

                  const times = result.map(rows => rows.time); 
                  const titles = result.map(rows => rows.title); 
                  const lengths = result.map(rows => rows.lengths); 

                  document.getElementById('now_playing').innerText = now_playing;

                  document.getElementById('times').innerText = times.join('');
                  document.getElementById('titles').innerText = titles.join('\n');
                  document.getElementById('lengths').innerText = lengths.join('\n');
                })
                .catch(error => {
                    document.getElementById('times').textContent = "Error loading CSV.";
                    console.error(error);
                });
        </script>
      </div>
    </div>
    
  </div>
</body>
</html>
